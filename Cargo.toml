[workspace]
resolver = "3"
members = ["crates/sidestage-dsp", "crates/sidestage-platform", "crates/sidestage"]
default-members = ["crates/sidestage"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
repository = "https://github.com/pixityy/Sidestage"

[workspace.dependencies]
sidestage-dsp = { path = "crates/sidestage-dsp" }
sidestage-platform = { path = "crates/sidestage-platform" }
anyhow = "1.0.104"
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
rtrb = "0.4.0"
directories = "6.0.0"

[profile.dev]
# The DSP runs on a real-time thread; unoptimized builds can underrun.
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
