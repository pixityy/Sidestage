[workspace]
resolver = "3"
members = ["crates/sidestage-dsp", "crates/sidestage-platform", "crates/sidestage"]
default-members = ["crates/sidestage"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
repository = "https://github.com/pixityy/Sidestage"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
sidestage-dsp = { path = "crates/sidestage-dsp" }
sidestage-platform = { path = "crates/sidestage-platform" }
anyhow = "1.0.104"
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
rtrb = "0.4.0"
directories = "6.0.0"

[profile.dev]
# The DSP runs on a real-time thread; unoptimized builds can underrun.
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# The DSP crate as well ("*" covers only dependencies). This also makes its tests, which render
# and check long stretches of audio sample by sample, about 8x faster (on a desktop, the slowest
# two test files drop from 100 s to 12 s). Debug assertions and overflow checks stay on.
[profile.dev.package.sidestage-dsp]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
