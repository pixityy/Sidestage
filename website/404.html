<!doctype html>
<html lang="en" data-update="next">

<link rel="stylesheet" href="/css/site.css">
<style>
  .lost{min-height:100vh;display:grid;place-items:center;text-align:center;padding:40px var(--gutter);

  .lost h1{font-size:clamp(2.4rem,1.4rem + 4vw,4.4rem)}
  .lost h1 em{font-weight:500;color:var(--accent-hi)}

<body>
<main class="lost">
  <div>
    <span class="act-num" aria-hidden="true">404</span>
    <h1>Not on <em>the programme.</em></h1>

    <div class="ctas">
      <a class="btn btn-primary" href="/">Back to the stage</a>
      <a class="btn btn-ghost" href="https://github.com/pixityy/Sidestage/releases/latest">Download Sidestage</a>

  </div>
