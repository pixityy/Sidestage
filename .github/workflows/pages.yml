name: Website

# Publishes website/ to GitHub Pages (https://sidestage.it.com), with the demo video, poster and
# screenshots copied in from docs/media/ so they are not stored twice in the repository.

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/media/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits instead of cancelling one that is half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site/media
          cp -R website/. _site/
          rm -f _site/*.py _site/README.md _site/audio/README.md
          # Stamp the CSS and JS links with the commit, so browsers never mix old and new files.
          sed -i "s/?v=dev/?v=${GITHUB_SHA::7}/g" _site/index.html _site/404.html _site/js/site.js
          cp docs/media/*.png docs/media/*.jpg docs/media/*.mp4 _site/media/
          ls -la _site _site/media
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
